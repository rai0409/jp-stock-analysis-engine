[project]
name = "jp-stock-analysis-engine"
version = "0.1.0"
description = "Japanese stock analysis engine for screening and self-directed trading research"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
]

[project.scripts]
build-jquants-price-reaction-v2 = "jp_stock_analysis.analysis.jquants_price_reaction_v2:main"
build-jquants-abnormal-return = "jp_stock_analysis.analysis.jquants_abnormal_return:main"
build-jquants-liquidity-features = "jp_stock_analysis.analysis.jquants_liquidity:main"
build-jquants-robust-summary = "jp_stock_analysis.analysis.jquants_robust_summary:main"
build-jquants-commercial-quality-dataset = "jp_stock_analysis.analysis.jquants_commercial_quality_pipeline:main"
build-jquants-commercial-quality-rankings = "jp_stock_analysis.analysis.jquants_commercial_quality_rankings:main"
build-jquants-commercial-quality-enriched-rankings = "jp_stock_analysis.analysis.jquants_commercial_quality_enrichment:main"
build-jquants-commercial-daily-dashboard = "jp_stock_analysis.analysis.jquants_commercial_daily_dashboard:main"
build-jquants-extraction-audit = "jp_stock_analysis.analysis.jquants_extraction_audit:main"
build-jquants-commercial-analysis-validity-audit = "jp_stock_analysis.analysis.jquants_commercial_analysis_validity_audit:main"
build-jquants-commercial-signal-validation = "jp_stock_analysis.analysis.jquants_commercial_signal_validation:main"
fetch-jquants-daily-bars-incremental = "jp_stock_analysis.cli:main_fetch_jquants_daily_bars_incremental"
serve-jquants-commercial-dashboard = "jp_stock_analysis.web.commercial_dashboard_app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
# Optional modeling backends. The modeling package itself needs no extra deps
# (it uses the core pandas/numpy); these only add the optional ML rankers and
# are NEVER required for a minimal install or for the test-suite to pass.
modeling = []
lightgbm = [
  "lightgbm>=4.0",
  "scikit-learn>=1.3",  # required by lightgbm's LGBMRanker / LGBMRegressor wrappers
]
catboost = [
  "catboost>=1.2",
]
# Excel (.xlsx) listing/delisting files for survivorship control
excel = [
  "openpyxl>=3.1",
]
# Research-only transformer models (TFT-lite, cross-sectional transformer).
# OFF by default; enable per run with --research-transformers. CPU wheels:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
research-transformers = [
  "torch>=2.2",
]
all-modeling = [
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "catboost>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
