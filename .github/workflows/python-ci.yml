name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHON_BIN: python
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Full pytest
        run: python -m pytest -q --tb=short -ra

      - name: Ruff changed recovery modules
        run: |
          python -m ruff check \
            scripts/fetch_jquants_financial_summary_daily.py \
            scripts/backfill_jquants_financial_summary.py \
            scripts/recover_jquants_universe.py \
            tests/test_fetch_jquants_financial_summary_daily.py \
            tests/test_backfill_jquants_financial_summary.py \
            tests/test_recover_jquants_universe.py
