name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHON_BIN: python
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Full pytest
        run: python -m pytest -q --tb=short -ra

      - name: Diagnose synthetic golden mismatch
        if: ${{ failure() }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import platform
          import shutil
          import tempfile
          from pathlib import Path

          import numpy
          import pandas
          from jp_stock_analysis.modeling.regression_baseline import (
              GOLDEN_RUN_ID,
              GOLDEN_TIMESTAMP,
              compare_to_baseline,
              load_baseline,
              run_golden_synthetic_pipeline,
          )

          print("PYTHON:", platform.python_version())
          print("NUMPY:", numpy.__version__)
          print("PANDAS:", pandas.__version__)

          baseline = load_baseline(
              "tests/fixtures/pipeline_baseline/golden_pipeline_baseline.json"
          )

          with tempfile.TemporaryDirectory() as temp:
              fresh = run_golden_synthetic_pipeline(Path(temp) / "diagnostic")
              report = compare_to_baseline(
                  fresh,
                  baseline,
                  run_id=GOLDEN_RUN_ID,
                  fixed_timestamp=GOLDEN_TIMESTAMP,
              )

              print("REGRESSION_COUNTS:", report["counts"])
              for entry in report["entries"]:
                  if entry["classification"] == "unchanged":
                      continue
                  print("CHANGED_ARTIFACT:", entry["relative_path"])
                  print("CLASSIFICATION:", entry["classification"])
                  if entry.get("diff"):
                      print(
                          "DIFF:",
                          json.dumps(entry["diff"], sort_keys=True)
                      )
              selected = (
                  "ensemble/ensemble.json",
                  "linear/elastic_net/model_metadata.json",
                  "linear/elastic_net/predictions.csv",
                  "linear/ridge/model_metadata.json",
                  "linear/ridge/predictions.csv",
                  "modeling_report.json",
                  "modeling_report.md",
                  "neutralization/neutralized_metrics.json",
              )
              export_root = Path(os.environ["RUNNER_TEMP"]) / "synthetic-golden-diff"
              for rel in selected:
                  source = fresh / rel
                  if not source.is_file():
                      raise FileNotFoundError(source)
                  destination = export_root / rel
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, destination)
              print("SYNTHETIC_ARTIFACTS_EXPORTED:", len(selected))
          PYCODE

      - name: Upload synthetic golden diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-golden-diff
          path: ${{ runner.temp }}/synthetic-golden-diff/
          if-no-files-found: error
          retention-days: 3

      - name: Ruff changed recovery modules
        run: |
          python -m ruff check \
            scripts/fetch_jquants_financial_summary_daily.py \
            scripts/backfill_jquants_financial_summary.py \
            scripts/recover_jquants_universe.py \
            tests/test_fetch_jquants_financial_summary_daily.py \
            tests/test_backfill_jquants_financial_summary.py \
            tests/test_recover_jquants_universe.py
